version: '3.8'

services:
  # 1. Zookeeper (Kafka의 메타데이터 관리)
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  # 2. Kafka Broker (메시지 브로커)
  kafka:
    image: confluentinc/cp-kafka:6.2.6   # 버전 명시
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  # 3. Elasticsearch (데이터 저장 및 분석 엔진)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m # 메모리 설정 (운영체제에 따라 조정)
      # --- [핵심 수정] 보안 비활성화 옵션 추가 ---
      - xpack.security.enabled=false
      - xpack.security.transport.ssl.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata:/usr/share/elasticsearch/data # 데이터 영속성
    ports:
      - "9200:9200"
      - "9300:9300"

  # 4. Kibana (데이터 시각화 대시보드)
  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.10
    container_name: kibana
    depends_on:
      - elasticsearch
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    ports:
      - "5601:5601"

  # 5. Node.js Producer (사용자 이벤트를 Kafka로 발행)
  node-producer:
    build: ./node-producer # node-producer 폴더의 Dockerfile 사용
    container_name: node_producer
    depends_on:
      - kafka # Kafka가 준비된 후에 실행
    environment:
      KAFKA_BROKER: kafka:29092 # Kafka 내부 네트워크 주소 사용
    volumes:
      - ./node-producer:/usr/src/app # 로컬 코드 변경 시 컨테이너에 반영
      - /usr/src/app/node_modules
    command: node index.js # Node.js 앱 시작 명령어

    # 6. Node.js Consumer (Kafka에서 이벤트 소비 후 Elasticsearch에 적재)
  node-consumer:
    build: ./node-consumer # node-consumer 폴더의 Dockerfile 사용
    container_name: node_consumer
    depends_on:
      - kafka         # Kafka에서 읽어야 함
      - elasticsearch # Elasticsearch에 써야 함
    environment:
      KAFKA_BROKER: kafka:29092             # Kafka 내부 네트워크 주소
      ELASTICSEARCH_URL: http://elasticsearch:9200 # ES 내부 네트워크 주소
    volumes:
      - ./node-consumer:/usr/src/app        # 로컬 코드 변경 시 컨테이너에 반영
      - /usr/src/app/node_modules           # 의존성 설치 폴더 덮어쓰기 방지
    command: node index.js # Node.js 앱 시작 명령어

volumes:
  esdata: